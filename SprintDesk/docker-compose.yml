services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sprintdesk
      POSTGRES_USER: sprintdesk
      POSTGRES_PASSWORD: sprintdesk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintdesk -d sprintdesk"]
      interval: 3s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://sprintdesk:sprintdesk@db:5432/sprintdesk
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-for-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
